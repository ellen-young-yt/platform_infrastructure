repos:
  - repo: local
    hooks:
      - id: format-code
        name: Format all code
        description: Format Terraform and Python code
        entry: make format
        language: system
        files: \.(tf|py)$
        pass_filenames: false

      - id: lint-code
        name: Lint all code
        description: Lint Terraform and Python code using centralized make command
        entry: make lint
        language: system
        files: \.(tf|py)$
        pass_filenames: false

      - id: security-scan
        name: Security scan
        description: Run security scanning using centralized make command
        entry: make security-scan
        language: system
        files: \.tf$
        pass_filenames: false

      - id: test-unit
        name: Run unit tests
        description: Run unit tests using centralized make command
        entry: make test-unit
        language: system
        files: \.(tf|py)$
        pass_filenames: false

  # Keep essential file checks that don't have make equivalents
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        description: This hook trims trailing whitespace

      - id: end-of-file-fixer
        name: Fix end of files
        description: Ensures that a file is either empty or ends with one newline

      - id: check-yaml
        name: Check YAML
        description: This hook checks yaml files for parseable syntax

      - id: check-json
        name: Check JSON
        description: This hook checks json files for parseable syntax

      - id: check-merge-conflict
        name: Check for merge conflicts
        description: Check for files that contain merge conflict strings

      - id: check-added-large-files
        name: Check for added large files
        description: Prevent giant files from being committed
        args: ['--maxkb=1000']

      - id: detect-private-key
        name: Detect private key
        description: Detects presence of private keys

default_stages: [pre-commit, pre-push]
default_install_hook_types: [pre-commit, pre-push]
