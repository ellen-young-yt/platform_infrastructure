name: Pull Request Tests

on:
  pull_request:
    branches: [ main, staging, develop ]
    paths:
      - '**/*.py'
      - '**/*.tf'
      - '**/*.yml'
      - '**/*.yaml'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.pre-commit-config.yaml'
      - 'environments/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast linting and formatting checks
  lint-and-format:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run black (code formatting)
        run: black --check --diff .

      - name: Run flake8 (linting)
        run: flake8 .

      - name: Run mypy (type checking)
        run: mypy scripts/ --ignore-missing-imports

  # Terraform validation and security
  terraform-checks:
    name: Terraform Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan (validation only)
        run: |
          terraform plan -var-file=environments/dev.tfvars -input=false -detailed-exitcode

      - name: Set up Python for Checkov
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Checkov Security Scan (comprehensive)
        run: |
          checkov -d . \
            --framework terraform \
            --quiet \
            --compact \
            --output-format cli \
            --download-external-modules true

  # Unit tests (fast, no AWS dependencies)
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest tests/unit/ \
            -v \
            --tb=short \
            --cov=scripts \
            --cov-report=xml \
            --cov-report=term-missing

  # Pre-commit hooks validation
  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Install terraform-docs
        uses: terraform-docs/gh-actions@v1.0.0

      - name: Install tflint
        uses: terraform-linters/setup-tflint@v4

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  # Integration tests (require AWS - only on specific conditions)
  integration-tests:
    name: Integration Tests (Conditional)
    runs-on: ubuntu-latest
    # Only run integration tests if:
    # 1. PR has 'test-integration' label, OR
    # 2. PR modifies Terraform files, OR
    # 3. PR is from a maintainer (has write access)
    if: |
      contains(github.event.pull_request.labels.*.name, 'test-integration') ||
      contains(github.event.pull_request.labels.*.name, 'terraform') ||
      github.event.pull_request.author_association == 'OWNER' ||
      github.event.pull_request.author_association == 'COLLABORATOR'

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS credentials (if available)
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Run integration tests
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: |
          pytest tests/integration/ \
            -v \
            --tb=short \
            -m "integration and not slow" \
            --maxfail=3
        env:
          ENV: ci

      - name: Skip integration tests (no AWS credentials)
        if: ${{ env.AWS_ACCESS_KEY_ID == '' }}
        run: |
          echo "⚠️  Integration tests skipped - no AWS credentials configured"
          echo "To enable integration tests:"
          echo "1. Add AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY to repository secrets"
          echo "2. Or add 'test-integration' label to this PR"

  # Summary job that depends on all others
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - lint-and-format
      - terraform-checks
      - unit-tests
      - pre-commit
      # Note: integration-tests is conditional, so not included in needs
    steps:
      - name: CI Pipeline Success
        run: |
          echo "🎉 All CI checks passed!"
          echo "✅ Code formatting and linting"
          echo "✅ Terraform validation and security"
          echo "✅ Unit tests across Python versions"
          echo "✅ Pre-commit hooks"
