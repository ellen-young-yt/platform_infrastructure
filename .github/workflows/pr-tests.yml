name: Pull Request Tests

on:
  pull_request:
    branches: [ main, staging, develop ]
    paths:
      - '**/*.py'
      - '**/*.tf'
      - '**/*.yml'
      - '**/*.yaml'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.pre-commit-config.yaml'
      - 'environments/**'
      - 'Makefile'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Determine target environment for the PR
  determine-environment:
    name: Determine Target Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      tfvars_file: ${{ steps.set-env.outputs.tfvars_file }}
    steps:
      - name: Set target environment
        id: set-env
        run: |
          # Determine target environment based on PR target branch
          case "${{ github.base_ref }}" in
            "main")
              ENVIRONMENT="prod"
              TFVARS_FILE="environments/prod.tfvars"
              ;;
            "staging")
              ENVIRONMENT="staging"
              TFVARS_FILE="environments/staging.tfvars"
              ;;
            "develop")
              ENVIRONMENT="dev"
              TFVARS_FILE="environments/dev.tfvars"
              ;;
            *)
              # Default to dev for feature branches or unknown targets
              ENVIRONMENT="dev"
              TFVARS_FILE="environments/dev.tfvars"
              ;;
          esac

          echo "🎯 Target environment: $ENVIRONMENT"
          echo "📁 Using tfvars: $TFVARS_FILE"
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "tfvars_file=$TFVARS_FILE" >> $GITHUB_OUTPUT

  # Code quality checks
  code-quality:
    name: Code Quality & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Setup environment
        run: make setup

      - name: Format and lint code
        run: make lint

      - name: Check formatting
        run: |
          # Verify no changes were made by formatting
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ Code formatting changes required"
            git diff
            exit 1
          else
            echo "✅ Code is properly formatted"
          fi

  # Terraform validation using centralized make commands
  terraform-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest
    needs: determine-environment
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Setup environment
        run: make setup

      - name: Initialize Terraform
        run: make init ENV=${{ needs.determine-environment.outputs.environment }}

      - name: Run validation checks
        run: make validate ENV=${{ needs.determine-environment.outputs.environment }}

      - name: Configure AWS credentials for plan validation
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Terraform Plan (validation only)
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: make plan ENV=${{ needs.determine-environment.outputs.environment }}

      - name: Security scan
        run: make security-scan

  # CI-safe tests using centralized make commands
  ci-tests:
    name: CI Tests
    runs-on: ubuntu-latest
    needs: determine-environment
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Setup environment
        run: make setup

      - name: Initialize Terraform
        run: make init ENV=${{ needs.determine-environment.outputs.environment }}

      - name: Configure AWS credentials (if available)
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Run CI-safe tests
        run: make test-ci ENV=${{ needs.determine-environment.outputs.environment }}

      - name: Run integration tests (if infrastructure exists)
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: make test-integration ENV=${{ needs.determine-environment.outputs.environment }}

      - name: Integration test status
        if: ${{ env.AWS_ACCESS_KEY_ID == '' }}
        run: |
          echo "ℹ️  Integration tests skipped - no AWS credentials configured"
          echo "This is expected for PRs from forks or when AWS credentials are not available"

  # Cross-platform testing leveraging make setup
  cross-platform-tests:
    name: Cross-Platform Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Setup environment
        run: make setup

      - name: Run unit tests only (cross-platform)
        run: make test-unit

  # Summary job that depends on all others
  ci-success:
    name: CI Pipeline Success
    runs-on: ubuntu-latest
    needs:
      - determine-environment
      - code-quality
      - terraform-validation
      - ci-tests
      - cross-platform-tests
    steps:
      - name: All checks passed
        run: |
          echo "🎉 All CI checks passed!"
          echo "✅ Code quality and formatting"
          echo "✅ Terraform validation and security"
          echo "✅ CI-safe tests (unit + validation + integration)"
          echo "✅ Cross-platform compatibility"
          echo ""
          echo "Target environment: ${{ needs.determine-environment.outputs.environment }}"
          echo "Ready for merge! 🚀"



