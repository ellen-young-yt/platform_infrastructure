name: Pull Request Tests

on:
  pull_request:
    branches: [ main, staging, develop ]
    paths:
      - '**/*.py'
      - '**/*.tf'
      - '**/*.yml'
      - '**/*.yaml'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.pre-commit-config.yaml'
      - 'environments/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast linting and formatting checks
  lint-and-format:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run black (code formatting)
        run: black --check --diff .

      - name: Run flake8 (linting)
        run: flake8 .

      - name: Run mypy (type checking)
        run: mypy scripts/ --ignore-missing-imports

  # Terraform validation and security
  terraform-checks:
    name: Terraform Validation
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Install terraform-docs
        run: |
          curl -Lo terraform-docs.tar.gz https://github.com/terraform-docs/terraform-docs/releases/download/v0.17.0/terraform-docs-v0.17.0-$(uname)-amd64.tar.gz
          tar -xzf terraform-docs.tar.gz
          chmod +x terraform-docs
          sudo mv terraform-docs /usr/local/bin/terraform-docs

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Configure AWS credentials
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Terraform Plan (validation only)
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: |
          terraform plan -var-file=environments/dev.tfvars -input=false -detailed-exitcode

      - name: Terraform Documentation Check
        run: terraform-docs markdown . --output-check

      - name: Terraform Lint (TFLint)
        run: |
          tflint --init
          tflint --only=terraform_deprecated_interpolation \
                 --only=terraform_deprecated_index \
                 --only=terraform_unused_declarations \
                 --only=terraform_comment_syntax \
                 --only=terraform_documented_outputs \
                 --only=terraform_typed_variables \
                 --only=terraform_module_pinned_source \
                 --only=terraform_naming_convention

      - name: Set up Python for Checkov
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Checkov Security Scan (comprehensive)
        run: |
          checkov -d . \
            --framework terraform \
            --quiet \
            --compact \
            --download-external-modules true

  # Unit tests (fast, no AWS dependencies)
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest tests/unit/ \
            -v \
            --tb=short \
            --cov=scripts \
            --cov-report=xml \
            --cov-report=term-missing

  # Integration tests (require AWS)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS credentials (if available)
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Run integration tests
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: |
          pytest tests/integration/ \
            -v \
            --tb=short \
            -m "integration and not slow" \
            --maxfail=3
        env:
          ENV: ci

      - name: Skip integration tests (no AWS credentials)
        if: ${{ env.AWS_ACCESS_KEY_ID == '' }}
        run: |
          echo "⚠️  Integration tests skipped - no AWS credentials configured"
          echo "To enable integration tests:"
          echo "1. Add AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY to repository secrets"
          echo "2. Or add 'test-integration' label to this PR"

  # Summary job that depends on all others
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - lint-and-format
      - terraform-checks
      - unit-tests
      - integration-tests
    steps:
      - name: CI Pipeline Success
        run: |
          echo "🎉 All CI checks passed!"
          echo "✅ Code formatting and linting"
          echo "✅ Terraform validation and security"
          echo "✅ Unit tests across Python versions"
          echo "✅ Pre-commit hooks"
